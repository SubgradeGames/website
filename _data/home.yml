# Main page content. Markup lives in _includes/home/, behaviour in js/home*.js.
# Each game gets one feature card in the catalogue and keeps its own website.

tagline: "If it's not fun, why bother?"
lede: "Dense, feature-rich video games, made in Canada and sold for money. Sometimes they're fun."

# Lines the monk cycles through when clicked. The first one shows on load.
quips:
  - "Sometimes they're fun."
  - "All video games are certified organic."
  - "If you dislike money, consider buying our products."
  - "Please tolerate the colour green."
  - "If it's not fun, why bother?"

games:
  - code: A1
    name: Twinstick Arcade
    status: Available on Steam
    pitch: Blast and dash your way out of an arcade machine.
    site: /TwinstickArcade
    store: https://store.steampowered.com/app/1488150/Twinstick_Arcade/
    total: See Steam
    facts:
      - { label: Levels, value: "7" }
      - { label: Combat encounters, value: Dozens }
      - { label: Endless mode, value: Included }
      - { label: Colours, value: Green }
    # The first clip plays on load.
    clips:
      - name: Zooming out
        video: /assets/home/twinstick-zoom.mp4
        poster: /assets/home/twinstick-zoom.jpg
        thumb: /assets/home/twinstick-zoom-thumb.jpg
        alt: "Twinstick Arcade: holding right-click zooms the camera out over a maze of pixel trees."
      - name: Getting started
        video: /assets/home/twinstick-start.mp4
        poster: /assets/home/twinstick-start.jpg
        thumb: /assets/home/twinstick-start-thumb.jpg
        alt: "Twinstick Arcade tutorial: move with WASD, dash with Space, pause with Esc."
      - name: The Green Woods
        video: /assets/home/twinstick-woods.mp4
        poster: /assets/home/twinstick-woods.jpg
        thumb: /assets/home/twinstick-woods-thumb.jpg
        alt: "Twinstick Arcade: fighting enemies in The Green Woods."
      - name: First shots
        video: /assets/home/twinstick-shoot.mp4
        poster: /assets/home/twinstick-shoot.jpg
        thumb: /assets/home/twinstick-shoot-thumb.jpg
        alt: "Twinstick Arcade tutorial: left-click to shoot."

