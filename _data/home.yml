# Main page content. Every word shown on the page lives in this file.
# Markup lives in _includes/home/, behaviour in js/home*.js.
# Each game gets one feature card in the catalogue and keeps its own website.

studio: Subgrade
page_title: "Subgrade: Games For People"
tagline: "Interactive experiences for passionate players."
lede: "Feature rich video games for people like me! Check out our catalogue or read about the development process."

nav:
  games: Games
  devlog: Devlog
  contact: Contact
  buy_wide: Buy Twinstick Arcade
  buy_narrow: Buy on Steam

catalogue:
  title: Catalogue
  note: One game so far · each has its own site
  total_label: Total
  # {index}, {count} and {name} are filled in per clip. Example: "Clip 2 of 4 · Getting started".
  clip_caption: "Clip {index} of {count} · {name}"

games:
  - code: A1
    name: Twinstick Arcade
    status: Available on Steam
    pitch: Blast and dash your way out of an arcade machine.
    site: /TwinstickArcade
    store: https://store.steampowered.com/app/1488150/Twinstick_Arcade/
    total: See Steam
    store_label: Buy on Steam
    site_label: "Visit the game's site"
    facts:
      - { label: Levels, value: "7" }
      - { label: Combat encounters, value: Dozens }
      - { label: Endless mode, value: Included }
      - { label: Colours, value: Green }
    # The first clip plays on load.
    clips:
      - name: Zooming out
        video: /assets/home/twinstick-zoom.mp4
        poster: /assets/home/twinstick-zoom.jpg
        thumb: /assets/home/twinstick-zoom-thumb.jpg
        alt: "Twinstick Arcade: holding right-click zooms the camera out over a maze of pixel trees."
      - name: Getting started
        video: /assets/home/twinstick-start.mp4
        poster: /assets/home/twinstick-start.jpg
        thumb: /assets/home/twinstick-start-thumb.jpg
        alt: "Twinstick Arcade tutorial: move with WASD, dash with Space, pause with Esc."
      - name: The Green Woods
        video: /assets/home/twinstick-woods.mp4
        poster: /assets/home/twinstick-woods.jpg
        thumb: /assets/home/twinstick-woods-thumb.jpg
        alt: "Twinstick Arcade: fighting enemies in The Green Woods."
      - name: First shots
        video: /assets/home/twinstick-shoot.mp4
        poster: /assets/home/twinstick-shoot.jpg
        thumb: /assets/home/twinstick-shoot-thumb.jpg
        alt: "Twinstick Arcade tutorial: left-click to shoot."

# The empty slot after the last game doubles as the mailing-list signup.
next_slot:
  code: A2
  title: "Next game: not made yet"
  text: "We'll email you when this slot is stocked. No spam."
  email_label: Email address
  email_placeholder: you@example.com
  button: Notify me

mailing_list:
  action: https://aquinasgames.us2.list-manage.com/subscribe/post?u=c0bcb8f065abc8bea73a9bb06&id=f255b655b2
  honeypot: b_c0bcb8f065abc8bea73a9bb06_f255b655b2

devlog:
  title: From the workshop
  note: Devlog
  button: Read the devlog
  # Newest first. Only the first entry is shown.
  posts:
    - label: Devlog 1
      title: Level and Enemy Design
      date: 2021-03-13
      url: /TwinstickArcade/Devlog-1
      summary: "How enemies stay readable on a palette of four greens, why random shading beats a single light source under a CRT shader, and why every level is a maze. No keycards."
      image: /assets/home/devlog-1.jpg
      image_alt: "Twinstick Arcade's Bomber's Village level, with an enemy rendered under the CRT scanlines."

standards:
  title: Our standards
  text: "A small independent studio making video games we want to play. These are the promises we keep for every game we ship."
  promises:
    - name: Human-crafted
      text: "Every sprite, song, sound and line of writing is made by people. No AI-generated art, music or writing."
    - name: Made in Canada
      text: "Designed and built by an independent studio in Canada since 2020."
    - name: Pay once
      text: "No microtransactions, no ads. Buy the game and it's yours."

contacts:
  - { label: Press, email: press@subgrade.games }
  - { label: Support, email: support@subgrade.games }
  - { label: Everything else, email: contact@subgrade.games }
reply_time: We try to respond within 1-2 business days.
founded: 2020
sitemap_label: Sitemap
