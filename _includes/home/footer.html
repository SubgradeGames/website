{% assign home = site.data.home %}

<!-- Footer: contact desks, studio line, legal line -->
<footer class="site-foot" id="contact">
    <div class="wrap contacts">
        {% for contact in home.contacts %}
        <div>
            <h3 class="mono">{{ contact.label }}</h3>
            <p><a href="mailto:{{ contact.email }}">{{ contact.email }}</a></p>
        </div>
        {% endfor %}
    </div>
    <div class="wrap legal">
        <span>{{ home.made_by }}</span>
        <span>&copy; {{ home.founded }}-{{ site.time | date: "%Y" }} {{ home.studio }} · <a href="{{ '/sitemap.xml' | relative_url }}">{{ home.sitemap_label }}</a> · <a href="{{ '/feed.xml' | relative_url }}">{{ home.rss_label }}</a></span>
    </div>
</footer>
