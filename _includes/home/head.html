{% assign home = site.data.home %}
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ home.page_title }}</title>
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords" content="{{ site.keywords }}">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0083ED">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}">
    <meta property="og:title" content="{{ home.page_title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:image" content="{{ site.url }}/assets/logo.png">
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">

    <!-- Fonts: Fira for all text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Fira+Sans:wght@400;500;700;800&display=swap">

    <link rel="stylesheet" href="{{ '/css/normalize.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/home.css' | relative_url }}">

    <!-- Sky runs before first paint so night visitors never see a flash of day -->
    <script src="{{ '/js/home-sky.js' | relative_url }}"></script>
    <script src="{{ '/js/home.js' | relative_url }}" defer></script>
</head>
