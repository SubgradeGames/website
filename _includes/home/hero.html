{% assign home = site.data.home %}
{% assign lead_game = home.games | first %}

<!-- Hero: layered sky (time of day set by js/home-sky.js), nav, pitch, talking monk -->
<header class="hero" id="hero">
    <div class="hero-stars" aria-hidden="true"></div>
    <div class="band band-1" aria-hidden="true"></div>
    <img class="far-isle far-isle-1" src="{{ '/assets/home/rock.png' | relative_url }}" alt="">
    <img class="far-isle far-isle-2" src="{{ '/assets/home/rock.png' | relative_url }}" alt="">
    <img class="far-isle far-isle-3" src="{{ '/assets/home/rock.png' | relative_url }}" alt="">
    <div class="band band-2" aria-hidden="true"></div>
    <div class="band band-3" aria-hidden="true"></div>

    <nav class="wrap nav" aria-label="Main">
        <a class="wordmark" href="{{ '/' | relative_url }}">Aquinas Games</a>
        <div class="nav-links">
            <a class="nav-link" href="#games">Games</a>
            <a class="nav-link" href="#devlog">Devlog</a>
            <a class="nav-link" href="#contact">Contact</a>
            <a class="btn btn-light" href="{{ lead_game.store }}">
                <span class="wide-only">Buy {{ lead_game.name }}</span>
                <span class="narrow-only">Buy on Steam</span>
            </a>
        </div>
    </nav>

    <div class="wrap hero-body">
        <div class="pitch">
            <h1 class="pitch-title"><span class="sr-only">Aquinas Games: </span>{{ home.tagline }}</h1>
            <p class="pitch-lede">{{ home.lede }}</p>
            <p class="sky-chip mono" id="sky-chip" hidden></p>
        </div>

        <div class="monk-spot">
            <p class="monk-says" id="monk-says" aria-live="polite">{{ home.quips | first }}</p>
            <button class="monk-btn" id="monk" type="button" aria-label="Talk to the monk">
                <img class="monk" src="{{ '/assets/home/monk.png' | relative_url }}" alt="" width="39" height="46">
            </button>
            <script type="application/json" id="monk-quips">{{ home.quips | jsonify }}</script>
        </div>
    </div>
</header>
