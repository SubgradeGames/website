{% assign standards = site.data.home.standards %}

<!-- Standards: the about copy beside the studio's promises -->
<section class="standards" aria-labelledby="standards-title">
    <div class="wrap standards-in">
        <div>
            <h2 id="standards-title">{{ standards.title }}</h2>
            <p>{{ standards.text }}</p>
        </div>
        <ul class="promises">
            {% for promise in standards.promises %}
            <li class="promise">
                <h3 class="promise-name">{{ promise.name }}</h3>
                <p>{{ promise.text }}</p>
            </li>
            {% endfor %}
        </ul>
    </div>
</section>
